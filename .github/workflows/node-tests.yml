name: Node tests

on:
  push:
    branches: [main, feat/multiplayer-core]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: |
          for f in js/*.js js/core/*.js; do node --check "$f"; done
